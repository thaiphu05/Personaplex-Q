# ==============================================================================
# Master Hydra config — Qwen3-8B backbone on B200 (Blackwell sm_100)
# Requires: CUDA 12.8 driver, torch>=2.7 cu128, transformers==4.57.x
# Run: python -m personaplex_finetuning.train --config configs/config.yaml
#      smoke: thêm --smoke data.shuffle=false
# ==============================================================================
defaults:
  - model: qwen3-8b
  - data: vietnamese
  - lora: qwen
  - train: qwen
  - _self_

seed: 42

# --- overrides ---
model:
  root: /home/voice/data/voice/personaplex-7b-v1   # PersonaPlex checkpoint (Mimi + depformer graft)
  source: ../src
  device: cuda
  backbone: qwen
  qwen_id: /home/voice/data/models/Qwen3-8B        # local dir hoặc HF id

data:
  prepared_dir: /home/voice/data/voice/vdt/data_ready/synthetic_500h
  window_seconds: 100
  shuffle: true
  random_crop: false
  prompt_aug_prob: 0.0
  static_chunking: false
  swap_roles_after_pass: false
  val_ratio: 0.05
  # val_manifest: null           # bỏ trống = tự tìm val.jsonl, không có thì split theo val_ratio

train:
  output_dir: ../runs/qwen3-8B
  max_steps: 20000
  learning_rate: 1.0e-5            # Qwen backbone LoRA (tăng từ 1e-5: text lì)
  interface_lr: 5.0e-5             # depth I/O + adapters
  audio_embed_lr: 1.0e-4           # emb table (chỉ khi ft_embed=true)
  depformer_learning_rate: 5.0e-5  # depth LoRA (trả về mức ban đầu: audio vô nghĩa ở 5e-6)
  gradient_accumulation_steps: 8   # global batch = 1 × nGPU × 8
  warmup_steps: 100
  eval_every_steps: 1000
  save_every_steps: 1000
  gradient_checkpointing: false    # 8B fit thoải mái trong 180GB VRAM
  mixed_precision: bf16
  infer_every_steps: 1000          # free-generation mỗi N step (0 = tắt)
  infer_samples: 2                 # số mẫu val sinh mỗi lần infer

lora:
  qwen_rank: 64
  qwen_alpha: 128
  depformer_rank: 64
  depformer_alpha: 128
  qwen_targets: "q_proj,v_proj"    # Qwen3-8B; Qwen3.5-9B thì để trống = auto-detect
  ft_embed: true
  qlora: false                     # Qwen path không hỗ trợ QLoRA

# Decode params cho inference (infer_every_steps + tools.inference_smoke)
generation:
  use_sampling: true               # false = greedy
  temp: 0.3                        # audio temperature
  temp_text: 0.7                   # text temperature
  top_k: 250                       # audio top-k
  top_k_text: 25                   # text top-k
  audio_silence_frame_cnt: 6

# Loss objective (native contract)
# total = text_loss_weight * text + audio (CB0 + acoustic, chung mẫu số) + cb0_head_weight * cb0_head
first_codebook_weight_multiplier: 1.0   # semantic codebook (CB0) weight
nonsemantic_audio_weight: 0.02          # acoustic codebook CB1-7 weight
text_padding_weight: 0.3                # PAD weight; EPAD tùy epad_as_padding
text_loss_weight: 1.0                   # hệ số nhân text loss so với audio
epad_as_padding: false                  # true = EPAD (word onset) xuống mức PAD
user_loss: false                        # true = supervise cả user audio streams
cb0_head_weight: 1.0                    # chỉ backbone qwen: head CB0 phụ trên hidden Qwen

# Prompt template: auto = qwen nếu backbone qwen, native nếu PersonaPlex
text_prompt_template: auto
